plugins { id 'com.android.application' }
android {
 namespace 'dev.farhan.freq'
 compileSdk 35
 defaultConfig {
  applicationId 'dev.farhan.freq'
  minSdk 26
  targetSdk 35
  versionCode Integer.parseInt(System.getenv('FREQ_VERSION_CODE') ?: '5')
  versionName System.getenv('FREQ_VERSION_NAME') ?: '0.3.1'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { debug { storeFile rootProject.file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { debug { debuggable true }; release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
